name: Approval and workflow checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test approval gates
        run: node --test tests/*.test.js
      - name: Verify approved plan and diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node .issflow/hooks/verify-approval.js --base "origin/$BASE_REF"
          else
            node .issflow/hooks/verify-approval.js
          fi
      - name: Check commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-commit-messages.js "origin/$BASE_REF"
      - name: Verify generated installer template
        run: |
          node create-issflow/build.js
          git diff --exit-code -- create-issflow/template
      - name: Verify release package and clean install
        run: |
          set -euo pipefail
          cd create-issflow
          npm pack --dry-run --json > "$RUNNER_TEMP/issflow-pack.json"
          node -e '
            const p = require(process.env.RUNNER_TEMP + "/issflow-pack.json")[0];
            const names = new Set(p.files.map(f => f.path));
            for (const required of ["bin/cli.js", "template/.issflow/hooks/verify-approval.js", "template/.issflow/hooks/approval-policy.js", "template/.issflow/hooks/package.json", "template/.issflow/templates/PLAN-SCOPED.md"]) {
              if (!names.has(required)) throw new Error("Missing packed file: " + required);
            }
            if (p.files.some(f => f.path.includes("__pycache__") || /\\.(pyc|pyo)$/.test(f.path))) throw new Error("Generated bytecode in package");
            console.log("Package:", p.name, p.version, "files:", p.files.length);
          '
          package_name="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          for module_type in module commonjs; do
            tmp="$(mktemp -d)"
            printf '{"private":true,"type":"%s"}\\n' "$module_type" > "$tmp/package.json"
            npm install --prefix "$tmp" "$RUNNER_TEMP/$package_name" --no-audit --no-fund
            (
              cd "$tmp"
              node "$tmp/node_modules/create-issflow/bin/cli.js" --tool=codex --dry-run
              test ! -e .issflow
              node "$tmp/node_modules/create-issflow/bin/cli.js" --tool=codex
              test -f .issflow/hooks/verify-approval.js
              test -f .issflow/hooks/package.json
              test -f .issflow/templates/PLAN-SCOPED.md
              node "$tmp/node_modules/create-issflow/bin/cli.js" --tool=codex
              node .issflow/hooks/verify-approval.js --files src/example.ts && exit 1 || test "$?" -eq 1
            )
          done
